apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./argocd
    repoURL: https://github.com/Nordic-MVP-GitOps-Repos/interact-gateway.git
    targetRevision: new-verification-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
